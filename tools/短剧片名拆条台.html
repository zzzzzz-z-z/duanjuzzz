<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>短剧片名拆条台</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
  :root{
    --bg:#E9E5DC;
    --surface:#FAF8F3;
    --surface-2:#EFEBE2;
    --ink:#201E19;
    --ink-soft:#625D52;
    --line:#D5CFC1;
    --line-strong:#B9B1A0;
    --accent:#BC4628;
    --accent-dark:#9C371F;
    --accent-ink:#FFFFFF;
    --ok:#2E7D4F;
    --mono: ui-monospace, "Cascadia Code", "SFMono-Regular", Consolas, Menlo, monospace;
    --sans: "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    --serif: "Noto Serif SC", "Songti SC", "SimSun", serif;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family:var(--sans);
    background:var(--bg);
    color:var(--ink);
    line-height:1.6;
    min-height:100vh;
  }
  /* ===== 场记板斜纹签名 ===== */
  .clap-stripe{
    height:10px;
    background:repeating-linear-gradient(45deg, #221F1A 0 14px, #F1ECE1 14px 28px);
    border-bottom:2px solid #221F1A;
  }
  .wrap{ max-width:1180px; margin:0 auto; padding:26px 24px 64px; }
  header{ padding:30px 0 2px; }
  header h1{
    font-family:var(--serif);
    font-weight:900;
    font-size:34px;
    line-height:1.2;
    margin:0;
    letter-spacing:0.5px;
  }
  header .kicker{
    display:inline-flex; align-items:center; gap:8px;
    font-size:13px; letter-spacing:3px; color:var(--accent);
    font-weight:700;
    margin-bottom:10px;
  }
  header .kicker svg{ width:16px; height:16px; }
  header p.sub{
    margin:8px 0 0; color:var(--ink-soft); font-size:15px; max-width:66ch;
  }
  header p.sub code{
    font-family:var(--mono); background:var(--surface-2);
    border:1px solid var(--line); border-radius:4px; padding:0 5px; font-size:13px;
  }
  /* ===== 规则说明 ===== */
  .rules{
    margin:20px 0 16px;
    display:flex; flex-wrap:wrap; gap:10px;
  }
  .rule-chip{
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:8px;
    padding:7px 12px;
    font-size:13px; color:var(--ink-soft);
    display:inline-flex; align-items:center; gap:8px;
  }
  .rule-chip b{ color:var(--ink); font-weight:700; }
  .rule-chip .dot{ width:8px; height:8px; border-radius:50%; background:var(--accent); flex:none; }
  /* ===== 工具条 ===== */
  .toolbar{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 16px;
    display:flex; flex-wrap:wrap; align-items:center; gap:14px 18px;
  }
  .field{ display:flex; align-items:center; gap:10px; flex:1 1 360px; min-width:0; }
  .field label{ font-size:14px; font-weight:700; white-space:nowrap; }
  .field .prefix-input{
    flex:1 1 auto; min-width:0;
    font-family:var(--mono);
    font-size:14px;
    padding:9px 12px;
    border:1px solid var(--line-strong);
    border-radius:8px;
    background:#FFFDF9;
    color:var(--ink);
  }
  .field .prefix-input:focus{ outline:2px solid var(--accent); outline-offset:1px; border-color:transparent; }
  .field .hint{ font-size:12px; color:var(--ink-soft); white-space:nowrap; }
  .check{
    display:inline-flex; align-items:center; gap:8px;
    font-size:14px; cursor:pointer; user-select:none; min-height:44px;
  }
  .check input{ width:17px; height:17px; accent-color:var(--accent); }
  .btn{
    display:inline-flex; align-items:center; gap:8px;
    min-height:44px; padding:0 18px;
    border:none; border-radius:9px;
    font-family:var(--sans); font-size:14px; font-weight:700;
    cursor:pointer;
    background:var(--accent); color:var(--accent-ink);
    transition:background .15s ease, transform .05s ease;
  }
  .btn:hover{ background:var(--accent-dark); }
  .btn:active{ transform:translateY(1px); }
  .btn:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }
  .btn svg{ width:16px; height:16px; }
  /* ===== 双栏 ===== */
  .panes{
    margin-top:16px;
    display:grid; grid-template-columns:1fr 1fr; gap:16px;
  }
  .pane{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
    display:flex; flex-direction:column;
  }
  .pane-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:11px 16px;
    border-bottom:1px solid var(--line);
    background:var(--surface-2);
  }
  .pane-head h2{ margin:0; font-size:14px; font-weight:700; }
  .pane-head .count{ font-size:12px; color:var(--ink-soft); font-family:var(--mono); }
  textarea{
    width:100%;
    min-height:470px;
    border:none;
    resize:vertical;
    padding:16px;
    font-family:var(--mono);
    font-size:13.5px;
    line-height:1.75;
    color:var(--ink);
    background:#FFFDF9;
  }
  textarea:focus{ outline:none; }
  #output{ background:#F6F2E8; }
  /* ===== 底部统计 ===== */
  .footer-stats{
    margin-top:14px;
    display:flex; flex-wrap:wrap; gap:14px 18px; align-items:center;
    font-size:13px; color:var(--ink-soft);
  }
  .footer-stats .stat b{ color:var(--ink); font-family:var(--mono); }
  .toast-msg{ color:var(--ok); font-weight:700; }
  /* ===== 窄屏 ===== */
  @media (max-width:820px){
    .panes{ grid-template-columns:1fr; }
    textarea{ min-height:300px; }
    header h1{ font-size:26px; }
  }
</style>

<script src="_skin.js" data-tool="短剧片名拆条台" data-kind="plain"></script>
</head>
<body>
<div class="clap-stripe"></div>
<div class="wrap">
  <header>
    <div class="kicker">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8l16-3v6l-16 3z"/><path d="M4 14l16-3v6l-16 3z"/><line x1="4" y1="8" x2="4" y2="14"/><line x1="20" y1="5" x2="20" y2="11"/></svg>
      片名整理
    </div>
    <h1>短剧片名拆条台</h1>
    <p class="sub">把粘贴进来的整段剧名列表，统一去掉 <code>_</code> / <code>-</code> 后缀与自定义前缀，批量清洗成干净片名。</p>
  </header>

  <div class="rules" aria-label="处理规则">
    <span class="rule-chip"><span class="dot"></span><b>去后缀</b>从第一个 _ 或 - 起截断</span>
    <span class="rule-chip"><span class="dot"></span><b>去前缀</b>自定义 + 开头英文自动去除</span>
    <span class="rule-chip"><span class="dot"></span><b>删括号</b>（）、()、【】及内容一并删除</span>
    <span class="rule-chip"><span class="dot"></span><b>记忆前缀</b>填写内容自动保存</span>
  </div>

  <section class="toolbar" aria-label="处理设置">
    <div class="field">
      <label for="prefix">自定义前缀</label>
      <input class="prefix-input" id="prefix" type="text" autocomplete="off" spellcheck="false" placeholder="东风、爆爆飞、111、myz">
      <span class="hint">已自动记住，下次打开不用重填</span>
    </div>
    <label class="check"><input type="checkbox" id="dedupe" checked> 合并重复</label>
    <button class="btn" id="copyBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
      <span id="copyLabel">复制结果</span>
    </button>
  </section>

  <section class="panes">
    <div class="pane">
      <div class="pane-head"><h2>原始剧名</h2><span class="count" id="inCount">0 条</span></div>
      <textarea id="input" aria-label="原始剧名列表" placeholder="每行一条，粘贴整段剧名……"></textarea>
    </div>
    <div class="pane">
      <div class="pane-head"><h2>清洗结果</h2><span class="count" id="outCount">0 条</span></div>
      <textarea id="output" aria-label="清洗结果" spellcheck="false"></textarea>
    </div>
  </section>

  <div class="footer-stats">
    <span class="stat">输入 <b id="statIn">0</b> 条</span>
    <span class="stat">输出 <b id="statOut">0</b> 条</span>
    <span class="stat">去重合并 <b id="statDedup">0</b> 条</span>
    <span class="toast-msg" id="toast" role="status" aria-live="polite"></span>
  </div>
</div>

<script>
(function(){
  'use strict';
  var inputEl = document.getElementById('input');
  var outputEl = document.getElementById('output');
  var prefixEl = document.getElementById('prefix');
  var dedupeEl = document.getElementById('dedupe');
  var copyBtn = document.getElementById('copyBtn');
  var copyLabel = document.getElementById('copyLabel');
  var toastEl = document.getElementById('toast');
  var inCountEl = document.getElementById('inCount');
  var outCountEl = document.getElementById('outCount');
  var statIn = document.getElementById('statIn');
  var statOut = document.getElementById('statOut');
  var statDedup = document.getElementById('statDedup');

  function splitPrefixes(str){
    return str.split(/[,，、\s;；]+/).map(function(s){ return s.trim(); }).filter(Boolean);
  }

  function process(){
    var raw = inputEl.value;
    var lines = raw.split(/\r?\n/);
    var prefixes = splitPrefixes(prefixEl.value);
    prefixes.sort(function(a,b){ return b.length - a.length; });
    var result = [];
    var total = 0;
    for (var i = 0; i < lines.length; i++){
      var t = lines[i].trim();
      if (!t) continue;
      total++;
      var s = t;
      var idx = -1;
      for (var j = 0; j < s.length; j++){
        if (s.charAt(j) === '_' || s.charAt(j) === '-'){
          idx = j; break;
        }
      }
      if (idx !== -1) s = s.slice(0, idx);
      // 自定义前缀
      for (var k = 0; k < prefixes.length; k++){
        if (s.startsWith(prefixes[k])){
          s = s.slice(prefixes[k].length);
          break;
        }
      }
      // 开头英文（不分大小写）自动去除
      s = s.replace(/^[A-Za-z]+/, '');
      // 删除括号及内容：（）全角圆括号、()半角圆括号、【】方括号
      s = s.replace(/[（(【][^）)】]*[）)】]/g, '');
      // 去除末尾残留英文（如 GGD）
      var prev;
      do {
        prev = s;
        s = s.replace(/\s*[A-Za-z]+\s*$/, '');
      } while (s !== prev);
      s = s.trim();
      if (!s) continue;
      if (dedupeEl.checked && result.indexOf(s) !== -1) continue;
      result.push(s);
    }
    var deduped = total - result.length;
    outputEl.value = result.join('\n');
    inCountEl.textContent = total + ' 条';
    outCountEl.textContent = result.length + ' 条';
    statIn.textContent = total;
    statOut.textContent = result.length;
    statDedup.textContent = dedupeEl.checked ? deduped : 0;
  }

  // 前缀持久化记忆：打开页面自动恢复上次填写
  var SAVE_KEY = 'dramaCleanerPrefix';
  try {
    var savedPrefix = localStorage.getItem(SAVE_KEY);
    if (savedPrefix) prefixEl.value = savedPrefix;
  } catch(e){}
  function savePrefix(){
    try { localStorage.setItem(SAVE_KEY, prefixEl.value); } catch(e){}
  }

  inputEl.addEventListener('input', process);
  prefixEl.addEventListener('input', function(){ savePrefix(); process(); });
  dedupeEl.addEventListener('change', process);

  var copyTimer = null;
  copyBtn.addEventListener('click', function(){
    var val = outputEl.value;
    if (!val){
      toastEl.textContent = '没有可复制的内容';
      return;
    }
    function done(){
      copyLabel.textContent = '已复制';
      toastEl.textContent = '结果已复制到剪贴板';
      if (copyTimer) clearTimeout(copyTimer);
      copyTimer = setTimeout(function(){
        copyLabel.textContent = '复制结果';
        toastEl.textContent = '';
      }, 1800);
    }
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(val).then(done, function(){ fallbackCopy(val); done(); });
    } else {
      fallbackCopy(val); done();
    }
  });

  function fallbackCopy(text){
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch(e){}
    document.body.removeChild(ta);
  }

  process();
})();
</script>
</body>
</html>
